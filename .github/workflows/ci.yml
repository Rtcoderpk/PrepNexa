name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ts:
    name: TypeScript (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://prepnexa.vercel.app
        run: npm run build

  python:
    name: Python (pythonai tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pythonai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        # Only the pure speech_metrics module is tested — no heavy ML deps.
        run: pip install pytest==8.3.5

      - name: Run tests
        run: pytest -q
