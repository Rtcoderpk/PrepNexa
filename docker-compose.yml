version: "3.9"

services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interviewiq-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      OLLAMA_URL: http://ollama:11434
      PYTHONAI_URL: http://pythonai:8000
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://redis:6379
      FEEDBACK_QUEUE: redis
    depends_on:
      ollama:
        condition: service_healthy
      pythonai:
        condition: service_healthy
      redis:
        condition: service_healthy

  pythonai:
    build:
      context: ./pythonai
      dockerfile: Dockerfile
    container_name: interviewiq-pythonai
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Model cache persisted across restarts so containers don't re-download.
    volumes:
      - pythonai-models:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: interviewiq-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pull the default chat + embedding models on first boot.
    entrypoint:
      - sh
      - -c
      - |
        /bin/ollama serve &
        sleep 3
        ollama pull qwen3:8b || true
        ollama pull nomic-embed-text || true
        wait

  redis:
    image: redis:7-alpine
    container_name: interviewiq-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pythonai-models:
  ollama-models:
  redis-data:
