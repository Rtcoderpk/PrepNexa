version: "3.9"

# PrepNexa — optional single-host deployment. The application runs entirely on
# cloud services (Supabase + cloud AI APIs), so the only container required is
# the Next.js app. No Ollama, no Qwen, no local GPU/model download.
#
#   cp .env.example .env.local   # fill in Supabase + at least one AI provider key
#   docker compose up -d --build

services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prepnexa-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      RATE_LIMIT_STORE: memory